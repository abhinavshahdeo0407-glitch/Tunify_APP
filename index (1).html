<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tunify – Music Player</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <h1 class="logo"><span class="dot"></span>Tunify</h1>
      <nav>
        <button class="nav-btn active" data-view="all">⌂ Home</button>
        <button class="nav-btn" id="searchNav">⌕ Search</button>
        <button class="nav-btn" data-view="liked">♥ Liked Songs</button>
      </nav>
      <h2 class="side-title">Your playlists</h2>
      <div id="playlists"></div>
    </aside>

    <main>
      <header class="topbar">
        <input id="search" type="search" placeholder="What do you want to play?" aria-label="Search songs">
      </header>
      <section class="hero">
        <div id="heroCover" class="cover big"></div>
        <div class="hero-text">
          <p>Playlist</p>
          <h2 id="viewTitle">All Songs</h2>
          <p id="viewMeta"></p>
        </div>
        <button id="playAll" class="play" aria-label="Play playlist">▶</button>
      </section>
      <div id="tracks"></div>
    </main>

    <footer class="player">
      <div class="now">
        <div id="pCover" class="cover sm"></div>
        <div class="meta"><b id="pTitle">Nothing playing</b><span id="pArtist">Pick a song to start</span></div>
        <button id="pLike" class="icon" aria-label="Like song">♡</button>
      </div>
      <div class="center">
        <div class="controls">
          <button id="shuffle" class="icon" title="Shuffle">⇄</button>
          <button id="prev" class="icon" title="Previous">⏮</button>
          <button id="play" class="play" title="Play / Pause">▶</button>
          <button id="next" class="icon" title="Next">⏭</button>
          <button id="repeat" class="icon" title="Repeat">↻</button>
        </div>
        <div class="seek">
          <span id="cur">0:00</span>
          <input id="progress" type="range" min="0" max="100" step="0.1" value="0" aria-label="Seek">
          <span id="dur">0:00</span>
        </div>
      </div>
      <div class="vol">
        <button id="mute" class="icon" title="Mute">🔊</button>
        <input id="volume" type="range" min="0" max="1" step="0.01" value="0.7" aria-label="Volume">
      </div>
    </footer>
  </div>
  <audio id="audio" preload="metadata"></audio>
  <script src="script.js"></script>
</body>
</html>
